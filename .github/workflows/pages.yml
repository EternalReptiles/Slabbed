# Publishes the web version of the app to https://eternalreptiles.github.io/<repo name>/ on every push to main.
name: Website
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
        env: { CI: '1' }
      # Home-screen icon for "Add to Home Screen", then a copy of the page for unknown paths (a refreshed card page).
      - run: |
          cp assets/icon.png dist/apple-touch-icon.png
          sed -i 's#</head>#<link rel="apple-touch-icon" href="/${{ github.event.repository.name }}/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Slabbed"></head>#' dist/index.html
          cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
